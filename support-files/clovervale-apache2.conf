<IfModule ssl_module>
	<VirtualHost *:443>
		ServerName clovervale.example.com
		ServerAdmin webmaster@clovervale.example.com
		DocumentRoot /srv/www/clovervale/client

		SSLEngine on
		SSLCertificateFile /etc/letsencrypt/live/clovervale.example.com/fullchain.pem
		SSLCertificateKeyFile /etc/letsencrypt/live/clovervale.example.com/privkey.pem

		<IfModule headers_module>
			Header always set Strict-Transport-Security "max-age=315360000; includeSubDomains"
			Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; form-action 'self'; font-src data:"
			Header always set X-Frame-Options SAMEORIGIN
			Header always set X-Content-Type-Options nosniff
			Header always set Cache-Control "no-cache, no-store, must-revalidate"
		</IfModule>

		# logs
		ErrorLog ${APACHE_LOG_DIR}/clovervale/error.log
		<IfModule log_config_module>
			CustomLog ${APACHE_LOG_DIR}/clovervale/access.log combined
		</IfModule>

		<IfModule proxy_http_module>
			ProxyPass /ws unix:/run/clovervale/clovervale.sock|http://clovervale.example.com/ws upgrade=websocket
		</IfModule>
	</VirtualHost>
</IfModule>
<Directory /srv/www/clovervale/client>
	<IfModule authz_core_module>
		Require all granted
	</IfModule>
</Directory>
<Directory /srv/www/clovervale/client/assets>
	<IfModule headers_module>
		Header always set Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable"
	</IfModule>
</Directory>

<VirtualHost *:80>
	ServerName clovervale.example.com
	ServerAdmin webmaster@clovervale.example.com
	DocumentRoot /srv/www/clovervale/client

	# logs
	ErrorLog ${APACHE_LOG_DIR}/clovervale/error.log
	<IfModule log_config_module>
		CustomLog ${APACHE_LOG_DIR}/clovervale/access.log combined
	</IfModule>

	# Redirects everyone to HTTPS.
	Redirect / https://clovervale.example.com/
</VirtualHost>
